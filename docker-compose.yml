services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: reportlyfeed
      POSTGRES_PASSWORD: reportlyfeed123
      POSTGRES_DB: reportlyfeed
    ports:
      - "5432:5432"
    volumes:
      - reportlyfeed_dev_db:/var/lib/postgresql/data

volumes:
  reportlyfeed_dev_db:
